<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — SEATLOCK UI</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090e1c;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 440px;
        background: #151d30;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 32px;
        text-align: center;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 1.5rem;
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        background: #6366f1;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icon.svg" alt="SEATLOCK logo" width="56" height="56" />
      <h1>You are currently offline</h1>
      <p>
        Live seat availability and new bookings require an active internet connection.
        Your previously saved confirmed SeatPass tickets remain viewable inside SEATLOCK.
      </p>
      <a href="/bookings">View Saved Tickets</a>
    </main>
  </body>
</html>
